<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>TUNA Scenario Finder — Peter Verster</title>
    <meta name="description" content="A morphological scenario seed generator for futures characterised by Turbulence, Unpredictability, Novelty, and Ambiguity." />
    <script>
      // Apply theme before paint to prevent flash of wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('tuna-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
